function checksView(r){return '<p>以下檢查目前草稿；尚未儲存也可檢查。</p>'+[['需修正',r.errors,'error'],['人力缺班',r.shortages.map(x=>x.date+' '+S.labels[x.shift]+' 缺'+x.short+'人；照護容量不足'+x.uncovered+'位病人'),'warn']].map(([label,list,cls])=>'<details open><summary>'+label+' · '+list.length+'</summary><div class="list '+cls+'">'+(list.length?list.map(v=>'<p>'+e(v)+'</p>').join(''):'<p>目前無此類問題</p>')+'</div></details>').join('')+'<p class="muted">檢核依已輸入的正常班表進行。</p>';}
function settingsView(){const p=state().policy||{mode:'ordinary'},cfg=state().config||S.defaults;return '<h2>工時與班別</h2><div class="form-grid"><label>工時制度<select id="policy" '+(!editing?'disabled':'')+'>'+option('ordinary','一般工時',p.mode)+option('fourWeek','四週彈性工時',p.mode)+'</select></label><label>固定週期起日<input type="date" id="anchor" value="'+e(p.anchor||month+'-01')+'"></label>'+['D','E','N'].map(k=>'<label>'+S.labels[k]+'開始<input type="time" id="time-'+k+'" value="'+cfg[k]+'"></label>').join('')+'</div><p><label><input id="agreement" type="checkbox" '+(p.agreement?'checked':'')+'> 已確認機構有合法工會／勞資會議同意採四週制度</label></p>'+(editing?'<button id="save-settings">儲存設定</button>':'')+'<p class="muted">一般：每日8小時／週期7日40小時；四週：每日最多10小時／28日160小時，並檢核例休。班間11小時及連續工作最多6日為本排班器的保守設定。</p><a href="https://laws.mol.gov.tw/FLAW/FLAWDAT0201.aspx?beginpos=4&id=FL014930" target="_blank" rel="noopener">查看勞動基準法依據</a><h2 style="margin-top:25px">發布歷程</h2><div class="list">'+(state().audit||[]).slice(-20).reverse().map(x=>'<p>'+e(new Date(x.time).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}))+' · '+e(x.name||x.by)+' · '+e(({saveMonth:'儲存草稿',publish:'發布／重新發布',assignBeds:'當班分床',policy:'制度設定',config:'班別時間'})[x.action]||x.action)+'</p>').join('')+'</div>';}
function render(){const r=P.report(root,days,dates()),pub=dates().filter(d=>state().published?.[d]).length;app.innerHTML='<header><div><small>亞東紀念醫院</small><br><b>護理排班工作站</b></div><div class="actions"><a href="whiteboard.html">電子白板</a><a href="systems.html">系統入口</a><span>'+e(user.name)+'</span><button id="logout">登出</button></div></header><main class="wrap"><div class="heading"><div><small>WARD ROSTER</small><h1>月班表與人力配置</h1><span class="muted">預假、三班分配與責任床位集中管理</span></div><span class="badge">'+(dirty?'有未儲存變更':'草稿已載入')+' · 已發布'+pub+'日</span></div><div class="stats"><div class="stat"><small>可排護理師</small><strong>'+people().length+' <small>人</small></strong></div><div class="stat"><small>缺人班次</small><strong class="warn">'+r.shortages.length+'</strong></div><div class="stat"><small>需修正事項</small><strong class="error">'+r.errors.length+'</strong></div></div><div class="toolbar"><input id="month" type="month" value="'+month+'">'+(editing?'<button id="generate" class="primary">快速排班／重新排班</button><button id="save">儲存草稿</button><button id="publish">發布／重新發布本月</button><button id="revise">從已發布班表建立修訂草稿</button>':'')+'<button id="reload">重新讀取</button></div><div id="status" class="status" role="status">'+e(message)+'</div>'+(pub?'<div class="notice">已發布班表仍可修改。編輯與重新排班只改草稿；再次發布後，白板及各端才會使用新版本，舊發布內容保留歷程。</div>':'')+'<nav class="tabs">'+[['month','月班表'],['day','當日分床'],['requests','預假'],['checks','檢核與缺班'],['settings','制度與歷程']].map(([v,l])=>'<button data-tab="'+v+'" class="'+(tab===v?'active':'')+'">'+l+'</button>').join('')+'</nav><section class="panel">'+(tab==='month'?monthView():tab==='day'?dayView():tab==='requests'?requestsView():tab==='checks'?checksView(r):settingsView())+'</section></main>';bind();}
function mark(){dirty=true;const b=app.querySelector('.heading .badge');if(b)b.textContent='有未儲存變更';}
function setShift(id,date,k){const old=days[date].staff[id]||{};if(!k)delete days[date].staff[id];else days[date].staff[id]={...old,shift:k,beds:old.shift===k?old.beds||[]:[],leader:old.shift===k&&old.leader||false};mark();}
function bind(){app.querySelector('#logout').onclick=()=>{if(dirty&&!confirm('放棄未儲存草稿並登出？'))return;user=null;message='';login();};app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();});app.querySelector('#month').onchange=ev=>{if(!/^\d{4}-\d{2}$/.test(ev.target.value)||dirty&&!confirm('切換月份會放棄未儲存變更，確定切換？')){ev.target.value=month;return;}month=ev.target.value;selected=month+'-01';load();message='';render();};app.querySelector('#reload').onclick=()=>run(async()=>{if(dirty&&!confirm('放棄未儲存草稿並重新讀取？'))return;root=(await HospitalCloud.read()).value;load();message='已讀取最新資料';});app.querySelectorAll('[data-worker]').forEach(x=>x.onchange=()=>{setShift(x.dataset.worker,x.dataset.date,x.value);x.className=x.value||'blank';if(tab==='day')render();});if(editing){app.querySelector('#generate').onclick=()=>run(async()=>{days=P.generate(root,days,dates());dirty=true;message='已重新產生草稿：預假保留、例休錯開、責任床位已按連續床段隨機分配。請確認缺班與工時；尚未發布。';tab='month';});app.querySelector('#save').onclick=()=>run(save);app.querySelector('#publish').onclick=()=>run(async()=>{const r=P.report(root,days,dates());if(r.errors.length||r.shortages.length){tab='checks';throw Error('尚有需修正或缺班項目，已保留草稿；仍可繼續修改與重新排班。');}await save();await mutate({action:'publish',dates:dates()});message='已發布新版本；之前的發布內容已保留歷程，可隨時再修訂。';});app.querySelector('#revise').onclick=()=>run(async()=>{if(dirty&&!confirm('以已發布版本替換目前草稿？'))return;for(const d of dates())if(state().published?.[d])days[d]=copy(state().published[d]);dirty=true;message='已載入已發布內容作修訂，可直接修改或再次快速排班。';});}
if(tab==='day'){app.querySelector('#day-select').onchange=ev=>{if(!ev.target.value.startsWith(month+'-')){ev.target.value=selected;return;}selected=ev.target.value;render();};if(editing){app.querySelector('#allocate-day').onclick=()=>{days=P.allocateBeds(root,days,[selected]);dirty=true;message='已隨機分配本日三班連續床段，尚未發布';render();};app.querySelector('#census').onchange=ev=>{const n=Number(ev.target.value);if(!Number.isInteger(n)||n<0||n>Object.keys(root.patientsData).length)return;days[selected].census=n;mark();render();};app.querySelectorAll('[data-leader]').forEach(x=>x.onchange=()=>{const r=days[selected].staff[x.dataset.leader];if(!r||!['D','E','N'].includes(r.shift)){message='請先將此人排為上班班別';render();return;}r.leader=x.value!=='0';r.leaderLoad=Number(x.value)||2;mark();});app.querySelectorAll('[data-beds]').forEach(x=>x.onchange=()=>{const r=days[selected].staff[x.dataset.beds];if(!r)return;r.beds=x.value.split(/[,，、\s]+/).filter(Boolean);mark();});app.querySelectorAll('[data-reason]').forEach(x=>x.onchange=()=>{const r=days[selected].staff[x.dataset.reason];if(r){r.requestOverride=x.value;mark();}});}}
if(tab==='requests'&&editing){app.querySelector('#add-leave').onclick=()=>{const from=app.querySelector('#leave-from').value,to=app.querySelector('#leave-to').value,id=app.querySelector('#leave-person').value,k=app.querySelector('#leave-type').value;if(!from.startsWith(month+'-')||!to.startsWith(month+'-')||from>to){message='請選本月有效日期範圍';render();return;}for(const d of dates().filter(d=>d>=from&&d<=to)){days[d].requests||={};days[d].requests[id]={type:k,time:new Date().toISOString()};days[d].staff[id]={shift:k,beds:[]};}mark();render();};app.querySelectorAll('[data-remove-date]').forEach(b=>b.onclick=()=>{delete days[b.dataset.removeDate].requests[b.dataset.removeId];mark();render();});}
if(tab==='settings'&&editing)app.querySelector('#save-settings').onclick=()=>run(async()=>{const policy={mode:app.querySelector('#policy').value,anchor:app.querySelector('#anchor').value,agreement:app.querySelector('#agreement').checked},config=Object.fromEntries(['D','E','N'].map(k=>[k,app.querySelector('#time-'+k).value]));if(dirty)await save();await mutate({action:'policy',policy});await mutate({action:'config',config});message='工時制度及班別時間已更新';});}
async function mutate(data){const revision=state().revision||0;root=await HospitalCloud.transaction(r=>S.change(r,user,{...data,revision}));}
async function save(){await mutate({action:'saveMonth',month,days});dirty=false;message='草稿已儲存；已發布班表尚未改變。';}
async function run(fn){if(busy)return;busy=true;app.querySelectorAll('button').forEach(b=>b.disabled=true);try{await fn();}catch(err){message='未完成：'+err.message;}finally{busy=false;render();}}
window.addEventListener('beforeunload',ev=>{if(dirty){ev.preventDefault();ev.returnValue='';}});login();})();
</script></body></html>
