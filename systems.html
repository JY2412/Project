<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>院內系統入口｜設計預覽</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f7f5ee;color:#213a33;font:16px system-ui,"Microsoft JhengHei",sans-serif}header{background:#fffdf8;padding:18px max(5vw,20px);display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #d8c69e}header img{width:168px;max-width:57%;height:auto;display:block}.tag{color:#52645d;font-size:12px;letter-spacing:.09em}main{width:min(800px,90%);margin:auto;padding:clamp(30px,6vw,65px) 0 30px}.intro{margin-bottom:22px}.eyebrow{font-size:11px;font-weight:750;letter-spacing:.22em;color:#5a7061}h1{font-size:clamp(28px,5vw,45px);margin:8px 0;letter-spacing:.05em}nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0}.group-title{grid-column:1/-1;font-size:12px;font-weight:700;letter-spacing:.15em;padding:12px 0;border-bottom:1px solid #c8d1c5;color:#506559}.tile{min-height:148px;display:grid;justify-items:center;align-content:center;gap:5px;text-align:center;text-decoration:none;color:inherit;border-radius:16px;touch-action:manipulation}.tile:hover,.tile:focus-visible{background:#e8ede2}.tile:focus-visible{outline:2px solid #315b4c;outline-offset:-2px}.icon{display:grid;place-items:center;width:62px;height:62px;border-radius:19px;color:white;background:var(--tone);box-shadow:inset 0 1px 0 #ffffff55,0 4px 9px #253d3224;margin-bottom:4px}.icon svg{width:43px;height:43px;fill:none;stroke:currentColor;stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round}small{color:#51665b;font-size:13px}.demo{display:none}.demo:target{position:fixed;inset:0;display:grid;place-items:center;background:#173a34aa;padding:20px}.demo>div{width:min(360px,100%);background:#fffdf8;border-radius:18px;padding:24px}.demo a{display:inline-block;padding:11px 14px;background:#234d40;color:white;border-radius:8px;text-decoration:none}
@media(max-width:540px){main{padding-top:25px}.intro{margin-bottom:12px}nav{grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid #c8d1c5}.group-title{display:none}.tile{min-height:128px}.icon{width:56px;height:56px}.icon svg{width:39px;height:39px}}

body{background:#f7f5f0;color:#202e3b}
header{width:min(1040px,calc(100% - 40px));margin:auto;background:transparent;padding:20px 0;border-color:#d8cbb4}
.tag{color:#62635f}
main{width:min(760px,calc(100% - 36px));padding-top:clamp(32px,7vh,66px)}
.intro{text-align:center;margin-bottom:28px}
.eyebrow{color:#796953;letter-spacing:.25em}
h1{font-family:"Songti TC","Noto Serif TC",serif;font-weight:700;letter-spacing:.08em}
.group-title{color:#665e51;border-color:#ded6c8}
nav{column-gap:8px}
.tile:hover,.tile:focus-visible{background:#efebe2}
.icon{background:linear-gradient(145deg,#ffffff14,transparent),#33495b;border:1px solid #263b4b;border-radius:18px;box-shadow:inset 0 1px 0 #ffffff24,0 4px 9px #2435441c;color:#fbf9f3}
small{color:#595f63}
@media(max-width:540px){header{padding:15px 0}.intro{margin-bottom:20px}nav{border-color:#ded6c8}.tile{min-height:121px}}

@media(max-width:540px){
body{background:#f6f3ed;color:#233342}
header{width:calc(100% - 40px);min-height:64px;padding:12px 0}
header img{width:139px}
.tag{font-size:10px;letter-spacing:.04em}
main{width:calc(100% - 40px);padding:25px 0 24px}
.intro{text-align:left;margin:0 0 17px}
.eyebrow{display:none}
h1{font-family:inherit;font-size:29px;letter-spacing:.025em;margin:0;font-weight:750}
nav{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;border:0}
.tile{min-height:115px;justify-items:start;align-content:center;text-align:left;padding:11px 12px;border-radius:15px;background:#fffdf8;border:1px solid #e5ded1;box-shadow:0 2px 4px #3b332805;gap:3px}
.icon{width:36px;height:36px;border:0;border-radius:10px;background:#eceae3;color:var(--tone);box-shadow:none;margin-bottom:3px}
.icon svg{width:28px;height:28px;stroke-width:3}
.tile strong{font-size:16px;line-height:1.25}
.tile small{font-size:12px;line-height:1.25;color:#4b5964}
.tile:active{background:#ece6da}
}

@media(max-width:540px){
body{background:#f7f5ef}
header{border-color:#dad2c4}
main{padding-top:28px}
.intro{margin-bottom:22px}
h1{font-family:"Songti TC",serif;font-size:31px;letter-spacing:.06em}
nav{gap:0;border-block:1px solid #dad2c4}
.tile{min-height:122px;border:0;border-radius:0;box-shadow:none;background:transparent;padding:13px 12px 13px 10px;gap:5px}
.tile:nth-of-type(even){border-left:1px solid #dad2c4;padding-left:16px}
.tile:nth-of-type(n+3){border-top:1px solid #dad2c4}
.tile .icon{width:43px;height:43px;border-radius:13px;background:var(--tone);color:#fff}
.tile .icon svg{width:32px;height:32px;stroke-width:2.8}
.tile small{font-size:13px;color:#51616a}
.tile:active,.tile:focus-visible{background:#eee9de}
}

body{background:#f8f5fc;color:#243744}
header{justify-content:flex-start;border-color:#d8d2c7}
.wordmark{font-size:17px;letter-spacing:.12em;font-weight:750;line-height:1.4}
.wordmark span{display:block;font-size:9px;letter-spacing:.13em;font-weight:650;color:#5c675f;margin-top:3px}
@media(max-width:540px){
header,main{width:calc(100% - 44px)}
header{padding:19px 0;min-height:0}
main{padding-top:25px}
.intro{margin-bottom:21px}
h1{font-size:clamp(25px,7vw,33px);letter-spacing:.04em;line-height:1.25}
nav{border-color:#d8d2c7}
.tile,.tile:nth-of-type(even){min-height:120px;padding:12px 5px;text-align:center;justify-items:center}
.tile:nth-of-type(even),.tile:nth-of-type(n+3){border-color:#d8d2c7}
.tile .icon{margin:0 0 4px;background:linear-gradient(145deg,#ffffff19,transparent),var(--tone);border-radius:12px}
.tile strong{font-size:16px}
.tile small{font-size:12px}
}

@media(max-width:540px){
header,main{width:calc(100% - 36px)}
header{padding:17px 0 14px}
.wordmark,h1{font-family:"Songti TC","PMingLiU",serif;font-weight:700}
.wordmark{font-size:19px;letter-spacing:.08em}
.wordmark span{font-family:system-ui,sans-serif;font-size:9px;font-weight:550;letter-spacing:.13em}
main{padding:22px 0 18px}
.intro{margin-bottom:17px}
h1{font-size:clamp(28px,8vw,36px)}
.tile,.tile:nth-of-type(even){min-height:clamp(132px,calc((100svh - 171px)/3),190px);gap:5px}
.tile .icon{width:54px;height:54px;border-radius:15px;margin-bottom:5px}
.tile .icon svg{width:38px;height:38px}
.tile strong{font-size:18px;font-weight:680}
.tile small{font-size:13px;font-weight:400}
}

.tile .icon{background:linear-gradient(145deg,#ffffff19,transparent),var(--tone);color:#fff}
.tile[data-system="whiteboard"] .icon{color:#f4eee4}

@media (min-width: 541px){
  header{width:min(1100px,calc(100% - 80px));padding:23px 0 18px}
  main{width:min(1040px,calc(100% - 80px));padding:30px 0 40px}
  .intro{text-align:left;margin:0 0 22px}
  h1{font-size:clamp(30px,4vw,44px);letter-spacing:.04em;margin:0}
  nav{width:100%;max-width:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;border:0}
  nav .group-title{grid-column:1/-1;margin:7px 0 0;padding:5px 0;border:0;font-size:13px}
  nav .tile:nth-of-type(n){display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:14px;row-gap:4px;align-content:center;justify-items:start;text-align:left;padding:16px;min-height:92px;background:#ffffffb8;border:1px solid #e2dce9;border-radius:14px;box-shadow:0 2px 6px #35224a08}
  nav .tile:nth-of-type(n):hover{background:#fff;border-color:#bdb0cf}
  nav .tile .icon{grid-row:1/3;align-self:center;margin:0}
  nav .tile strong,nav .tile small{grid-column:2}
  nav .tile strong{font-size:16px;font-weight:680}
  nav .tile small{font-size:12px}
}
@media (min-width: 541px) and (max-width: 760px){
  header,main{width:calc(100% - 40px)}
  nav .tile:nth-of-type(n){column-gap:8px;padding:10px}
}

nav .tile .icon{border:0;box-shadow:0 3px 8px #24354416}
h1,nav,.demo{font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif}
h1{font-weight:720;letter-spacing:.03em}

@media (min-width: 541px){
  .intro{text-align:center}
  nav .tile:nth-of-type(n){
    grid-template-rows:1fr auto auto 1fr;
    row-gap:0
  }
  nav .tile .icon{grid-row:1/-1}
  nav .tile strong{grid-row:2;line-height:1.25}
  nav .tile small{grid-row:3;line-height:1.25;margin-top:2px}
}

.tile-copy{display:contents}
@media (min-width: 541px){
  nav .tile:nth-of-type(n){grid-template-rows:auto;align-items:center}
  nav .tile .icon{grid-row:1}
  nav .tile .tile-copy{display:flex;flex-direction:column;gap:2px;min-width:0}
  nav .tile .tile-copy strong,nav .tile .tile-copy small{margin:0;line-height:1.2}
}
