<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>亞東紀念醫院 醫療照護系統 (雙模式：手機/電腦書記端)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #FBF9F5; color: #4A4643; }
        .bg-muji-sidebar { background-color: #F5F2EC; border-right: 1px solid #E8E3DA; }
        .border-muji { border-color: #E8E3DA; }
    </style>
</head>
<body class="h-screen overflow-hidden flex flex-col">

    <!-- 頂部切換列：讓您隨時切換「書記大螢幕端」或「手機模擬操作」 -->
    <header class="h-14 bg-white border-b border-muji px-6 flex items-center justify-between shrink-0 shadow-xs">
        <div class="flex items-center space-x-3">
            <img src="https://www.femh.org.tw/images/template/logo_g.svg" alt="亞東醫院" class="h-7">
            <span class="text-sm font-bold text-[#5C554E]">亞東醫院 11G 病房智慧系統</span>
        </div>
        <div class="flex items-center space-x-3">
            <span class="text-xs text-emerald-700 font-bold bg-emerald-50 px-2.5 py-1 rounded border border-emerald-200">🟢 雙模式即時對接中</span>
            <button onclick="switchMode('pc')" id="btn-mode-pc" class="px-3 py-1.5 bg-[#8C7A6B] text-white text-xs font-bold rounded-lg shadow-xs">🖥️ 書記大螢幕端</button>
            <button onclick="switchMode('mobile')" id="btn-mode-mobile" class="px-3 py-1.5 bg-[#F0EDE6] text-[#5C554E] text-xs font-bold rounded-lg border border-muji">📱 手機操作模式</button>
        </div>
    </header>

    <!-- 模式 A：電腦書記端大螢幕 (PC Dashboard) -->
    <div id="mode-pc-container" class="flex-1 flex overflow-hidden">
        <aside class="w-64 bg-muji-sidebar p-4 flex flex-col justify-between shrink-0">
            <div class="space-y-4">
                <div class="text-xs font-bold text-[#8C7A6B] uppercase px-2">書記管理控制台</div>
                <nav class="space-y-1">
                    <button class="w-full text-left px-3 py-2.5 rounded-lg text-xs font-bold bg-white text-[#4A4643] border border-muji shadow-xs">🏥 全病房 45 床動態總覽</button>
                </nav>
            </div>
            <div class="text-[11px] text-[#8C827A] p-2 bg-white rounded-xl border border-muji">
                💡 提示：點擊上方「手機操作模式」可以直接在同一個頁面操作手機版，資料會即時同步！
            </div>
        </aside>

        <main class="flex-1 p-6 overflow-y-auto bg-[#FBF9F5] space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-base font-bold text-[#4A4643]">11F 病房 45 床即時狀態看板</h2>
                <button onclick="renderPCMatrix()" class="px-3 py-1.5 bg-white border border-muji text-xs font-bold rounded-lg shadow-xs">🔄 重新整理畫面</button>
            </div>
            <!-- 45床動態列表 -->
            <div id="pc-bed-grid" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3"></div>
        </main>
    </div>

    <!-- 模式 B：內嵌手機版操作介面 (Mobile App View) -->
    <div id="mode-mobile-container" class="hidden flex-1 flex items-center justify-center bg-slate-100 p-4">
        <div class="w-[360px] h-[720px] bg-white border-14 border-slate-800 rounded-[40px] shadow-2xl relative overflow-hidden flex flex-col">
            <!-- 內嵌您手機版的實際畫面結構，確保資料 100% 直接寫入共用資料庫 -->
            <iframe id="embedded-mobile-iframe" src="" class="w-full h-full border-none"></iframe>
        </div>
    </div>

    <script>
        const STORAGE_KEY_BEDS = 'femh_45beds_vFixed10';

        // 切換模式
        function switchMode(mode) {
            const pcDiv = document.getElementById('mode-pc-container');
            const mobDiv = document.getElementById('mode-mobile-container');
            const btnPc = document.getElementById('btn-mode-pc');
            const btnMob = document.getElementById('btn-mode-mobile');

            if (mode === 'pc') {
                pcDiv.classList.remove('hidden');
                mobDiv.classList.add('hidden');
                btnPc.className = "px-3 py-1.5 bg-[#8C7A6B] text-white text-xs font-bold rounded-lg shadow-xs";
                btnMob.className = "px-3 py-1.5 bg-[#F0EDE6] text-[#5C554E] text-xs font-bold rounded-lg border border-muji";
                renderPCMatrix();
            } else {
                pcDiv.classList.add('hidden');
                mobDiv.classList.remove('hidden');
                btnMob.className = "px-3 py-1.5 bg-[#8C7A6B] text-white text-xs font-bold rounded-lg shadow-xs";
                btnPc.className = "px-3 py-1.5 bg-[#F0EDE6] text-[#5C554E] text-xs font-bold rounded-lg border border-muji";
            }
        }

        // 渲染電腦端床位
        function renderPCMatrix() {
            const grid = document.getElementById('pc-bed-grid');
            grid.innerHTML = '';
            
            let rawBeds = localStorage.getItem(STORAGE_KEY_BEDS);
            if (!rawBeds) {
                grid.innerHTML = '<div class="text-xs text-slate-500 col-span-full">尚未偵測到手機版資料，請先點擊上方「手機操作模式」登入並操作一次即可！</div>';
                return;
            }

            let patientsData = JSON.parse(rawBeds);
            Object.keys(patientsData).sort().forEach(bedKey => {
                const p = patientsData[bedKey];
                const card = document.createElement('div');
                card.className = "bg-white border border-muji rounded-xl p-3 shadow-2xs space-y-1 text-xs";
                
                if (p.isEmpty) {
                    card.innerHTML = `<div class="font-bold text-slate-400">${bedKey}</div><div class="text-slate-400">空床</div>`;
                } else {
                    const latestVital = (p.vitals && p.vitals[0]) ? p.vitals[0] : null;
                    card.innerHTML = `
                        <div class="flex justify-between items-center font-bold text-[#4A4643]">
                            <span>${bedKey}</span>
                            <span class="text-[10px] bg-amber-50 text-amber-800 px-1.5 py-0.5 rounded">${p.assignedNurse || '未指派'}</span>
                        </div>
                        <div class="font-semibold text-slate-800 truncate">${p.name}</div>
                        <div class="text-[11px] text-slate-500 truncate">${p.extra || ''}</div>
                        <div class="pt-1 border-t border-muji text-[10px] text-[#786759]">
                            ${latestVital ? `T:${latestVital.t} \vert{} BP:${latestVital.bp}` : '無V/S紀錄'}
                        </div>
                    `;
                }
                grid.appendChild(card);
            });
        }

        // 自動每秒重新整理電腦端畫面，確保資料即時連動
        setInterval(() => {
            if (!document.getElementById('mode-pc-container').classList.contains('hidden')) {
                renderPCMatrix();
            }
        }, 1000);

        // 初始化設定 iframe 指向您原本的手機版檔案名稱
        document.getElementById('embedded-mobile-iframe').src = '新文字文件.html'; // 請依您的手機版實際檔名調整
        renderPCMatrix();
    </script>
</body>
</html>
