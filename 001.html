<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>亞東紀念醫院 11G病房護理站控制台 (書記端)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #FBF9F5; color: #4A4643; }
        .bg-muji-sidebar { background-color: #F5F2EC; border-right: 1px solid #E8E3DA; }
        .border-muji { border-color: #E8E3DA; }
        .badge-isolation-contact { background-color: #E6A282; color: #FFF; }
        .badge-isolation-air { background-color: #88A0A8; color: #FFF; }
        .badge-transfer { background-color: #D8B26E; color: #FFF; }
    </style>
</head>
<body class="h-screen overflow-hidden flex flex-col">

    <!-- 頂部導覽列 -->
    <header class="h-16 bg-white border-b border-muji px-6 flex items-center justify-between shrink-0 shadow-2xs">
        <div class="flex items-center space-x-4">
            <div class="flex items-center space-x-3">
                <img src="https://www.femh.org.tw/images/template/logo_g.svg" alt="亞東醫院" class="h-8">
                <div class="h-5 w-[1px] bg-slate-300"></div>
                <span class="text-base font-bold text-[#5C554E] tracking-wide">11G 病房智慧管理 Console (書記/大螢幕端)</span>
            </div>
            <span class="text-xs bg-[#F0EDE6] text-[#786759] font-medium px-2.5 py-1 rounded-md border border-muji">主動對接模式</span>
        </div>
        <div class="flex items-center space-x-4">
            <button onclick="loadDataFromStorage()" class="px-3 py-1.5 bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold rounded-lg transition shadow-2xs">
                🔄 立即同步手機資料
            </button>
            <div class="text-right">
                <div id="pc-clock-time" class="text-sm font-bold text-[#4A4643]">--:--:--</div>
                <div id="pc-clock-date" class="text-[11px] text-[#8C827A]">--</div>
            </div>
            <button onclick="openAnnounceModal()" class="px-3.5 py-1.5 bg-[#8C7A6B] hover:bg-[#786759] text-white text-xs font-medium rounded-lg transition">
                📢 發布公告
            </button>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden">
        <!-- 左側選單 -->
        <aside class="w-64 bg-muji-sidebar p-4 flex flex-col justify-between shrink-0">
            <div class="space-y-4">
                <div class="text-xs font-bold text-[#8C7A6B] tracking-wider px-2 uppercase">書記管理控制台</div>
                <nav class="space-y-1">
                    <button onclick="switchTab('matrix')" id="nav-matrix" class="w-full text-left px-3 py-2.5 rounded-lg text-xs font-bold bg-white text-[#4A4643] shadow-2xs border border-muji flex items-center justify-between">
                        <span>🏥 全病房 45 床總覽</span>
                    </button>
                    <button onclick="switchTab('scheduling')" id="nav-scheduling" class="w-full text-left px-3 py-2.5 rounded-lg text-xs font-medium text-[#6B635B] hover:bg-white hover:text-[#4A4643] transition flex items-center justify-between">
                        <span>👩‍⚕️ 護理排班與責任床位</span>
                    </button>
                    <button onclick="switchTab('vitals-monitor')" id="nav-vitals-monitor" class="w-full text-left px-3 py-2.5 rounded-lg text-xs font-medium text-[#6B635B] hover:bg-white hover:text-[#4A4643] transition flex items-center justify-between">
                        <span>📊 全病房生命徵象監控</span>
                    </button>
                </nav>

                <div class="pt-4 border-t border-muji">
                    <div class="text-xs font-bold text-[#8C7A6B] mb-2 px-2">交班廣播與公告紀錄</div>
                    <div id="sidebar-memo-box" class="bg-white p-3 rounded-xl border border-muji text-xs text-[#5C554E] leading-relaxed max-h-40 overflow-y-auto">
                        載入中...
                    </div>
                </div>
            </div>

            <div class="bg-white p-3 rounded-xl border border-muji space-y-2">
                <div class="text-xs font-bold text-[#4A4643] flex items-center justify-between">
                    <span>📱 手機模擬器對照</span>
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                </div>
                <button onclick="toggleMobileSimulator()" class="w-full py-1.5 bg-[#F0EDE6] hover:bg-[#E2DDD3] text-[#5C554E] text-xs font-bold rounded-lg transition border border-muji">
                    切換手機模擬檢視視窗
                </button>
            </div>
        </aside>

        <!-- 中間主畫面 -->
        <main class="flex-1 p-6 overflow-y-auto bg-[#FBF9F5]">
            <!-- 1. 床位總覽 -->
            <section id="tab-content-matrix" class="space-y-4">
                <h2 class="text-lg font-bold text-[#4A4643]">11F 病房動態矩陣看板</h2>
                <div id="pc-bed-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 2xl:grid-cols-5 gap-3"></div>
            </section>

            <!-- 2. 排班設定 -->
            <section id="tab-content-scheduling" class="hidden space-y-4">
                <div class="flex items-center justify-between">
                    <h2 class="text-lg font-bold text-[#4A4643]">護理師排班與床位分配控制</h2>
                    <button onclick="saveNurseAssignmentsFromPC()" class="px-4 py-2 bg-[#8C7A6B] text-white text-xs font-bold rounded-xl transition">💾 儲存並發布排班變更</button>
                </div>
                <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
                    <div class="bg-white p-5 rounded-2xl border border-muji space-y-4">
                        <select id="pc-nurse-select" onchange="loadNurseBedsToPCEditor()" class="w-full p-2.5 rounded-xl border border-muji text-xs font-bold bg-[#FBF9F5] outline-none">
                            <option value="許Ｏ媃">許Ｏ媃</option>
                            <option value="劉Ｏ綺">劉Ｏ綺</option>
                            <option value="游Ｏ妤">游Ｏ妤</option>
                            <option value="張Ｏ綺">張Ｏ綺</option>
                            <option value="張Ｏ蓉">張Ｏ蓉</option>
                            <option value="葉映誠">葉映誠</option>
                            <option value="劉家裕">劉家裕</option>
                        </select>
                        <div id="pc-scheduling-checkboxes" class="max-h-96 overflow-y-auto space-y-1.5 p-3 rounded-xl bg-[#FBF9F5] border border-muji text-xs"></div>
                    </div>
                    <div id="pc-nurse-assignment-cards" class="xl:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-3"></div>
                </div>
            </section>

            <!-- 3. 生命徵象監控 -->
            <section id="tab-content-vitals-monitor" class="hidden space-y-4">
                <h2 class="text-lg font-bold text-[#4A4643]">全病房即時生命徵象監控</h2>
                <div class="bg-white rounded-2xl border border-muji overflow-hidden">
                    <table class="w-full text-xs text-left border-collapse">
                        <thead>
                            <tr class="bg-[#F5F2EC] text-[#5C554E] border-b border-muji font-bold">
                                <th class="p-3">床號 / 姓名</th>
                                <th class="p-3">責任護師</th>
                                <th class="p-3">最新測量時間</th>
                                <th class="p-3">體溫 (T)</th>
                                <th class="p-3">脈搏 (P)</th>
                                <th class="p-3">血壓 (BP)</th>
                                <th class="p-3">血氧 (SpO2)</th>
                            </tr>
                        </thead>
                        <tbody id="pc-vitals-table-body" class="divide-y divide-muji"></tbody>
                    </table>
                </div>
            </section>
        </main>

        <!-- 右側手機版 App 實時鏡像測試視窗 -->
        <aside id="pc-mobile-simulator-drawer" class="w-[390px] bg-[#F5F2EC] border-l border-muji p-4 flex flex-col justify-between shrink-0 shadow-lg">
            <div class="flex items-center justify-between pb-3 border-b border-muji">
                <span class="text-sm font-bold text-[#4A4643]">手機 APP 對接對照鏡像</span>
                <button onclick="toggleMobileSimulator()" class="text-[#8C827A] font-bold">✕</button>
            </div>
            <div class="my-auto w-[350px] h-[700px] bg-slate-900 rounded-[38px] p-3 shadow-2xl border-4 border-slate-700 relative flex flex-col mx-auto overflow-hidden">
                <!-- 請將下方 src 改為您手機版檔案在同資料夾內的實際檔名，例如 新文字文件.html -->
                <iframe id="mobile-app-iframe" src="新文字文件.html" class="w-full h-full bg-white rounded-[28px] border-none pt-3"></iframe>
            </div>
            <div class="text-[11px] text-[#8C827A] text-center pt-2">※ 內部 iframe 即時加載同資料夾手機版</div>
        </aside>
    </div>

    <script>
        const STORAGE_KEY_BEDS = 'femh_45beds_vFixed10';
        const STORAGE_KEY_SCHEDULE = 'femh_nurse_schedule_vFixed10';
        const STORAGE_KEY_MEMO = 'femh_shared_memo_vFixed10';

        let patientsData = {};
        let nurseBedAssignments = {};

        function loadDataFromStorage() {
            let rawBeds = localStorage.getItem(STORAGE_KEY_BEDS);
            let rawSchedule = localStorage.getItem(STORAGE_KEY_SCHEDULE);
            let memo = localStorage.getItem(STORAGE_KEY_MEMO) || "交班注意事項載入中...";

            if (rawBeds) patientsData = JSON.parse(rawBeds);
            if (rawSchedule) nurseBedAssignments = JSON.parse(rawSchedule);

            document.getElementById('sidebar-memo-box').innerText = memo;
            renderBedMatrix();
            renderNurseAssignmentCards();
            renderVitalsTable();
        }

        // 主動輪詢機制：每 1 秒自動從 localStorage 讀取最新狀態，確保資料百分之百同步，不需動到手機版程式碼
        setInterval(() => {
            loadDataFromStorage();
        }, 1000);

        function switchTab(tabName) {
            ['matrix', 'scheduling', 'vitals-monitor'].forEach(t => {
                document.getElementById(`tab-content-${t}`).classList.add('hidden');
            });
            document.getElementById(`tab-content-${tabName}`).classList.remove('hidden');
            if (tabName === 'scheduling') loadNurseBedsToPCEditor();
        }

        function renderBedMatrix() {
            const grid = document.getElementById('pc-bed-grid');
            grid.innerHTML = '';
            Object.keys(patientsData).sort().forEach(bedKey => {
                const p = patientsData[bedKey];
                const card = document.createElement('div');
                if (!p || p.isEmpty) {
                    card.className = "bg-[#F5F2EC]/60 border border-dashed border-muji rounded-2xl p-3.5 flex flex-col justify-between h-32 opacity-70";
                    card.innerHTML = `<span class="font-bold text-[#8C827A] text-xs">${bedKey}</span><div class="text-center text-[#A0958B] text-xs">空床待清</div><span></span>`;
                } else {
                    card.className = "bg-white border border-muji rounded-2xl p-3.5 flex flex-col justify-between h-36 shadow-2xs";
                    const latestVital = (p.vitals && p.vitals[0]) ? p.vitals[0] : null;
                    card.innerHTML = `
                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <span class="font-bold text-[#4A4643] text-sm">${bedKey}</span>
                                <span class="text-[10px] bg-[#F5F2EC] text-[#786759] font-bold px-2 py-0.5 rounded-md">${p.assignedNurse || '未指派'}</span>
                            </div>
                            <div class="font-bold text-xs text-[#5C554E] truncate">${p.name || ''}</div>
                            <div class="text-[11px] text-[#8C827A] truncate mt-0.5">${p.extra || ''}</div>
                        </div>
                        <div class="pt-2 border-t border-muji text-[11px] text-[#786759]">
                            ${latestVital ? `T:${latestVital.t} \vert{} BP:${latestVital.bp}` : '無V/S紀錄'}
                        </div>
                    `;
                }
                grid.appendChild(card);
            });
        }

        function renderNurseAssignmentCards() {
            const container = document.getElementById('pc-nurse-assignment-cards');
            container.innerHTML = '';
            Object.keys(nurseBedAssignments).forEach(nurseName => {
                const assignedBeds = nurseBedAssignments[nurseName] || [];
                const card = document.createElement('div');
                card.className = "p-4 bg-white border border-muji rounded-2xl shadow-2xs space-y-2";
                card.innerHTML = `
                    <div class="flex justify-between items-center border-b border-muji pb-2 font-bold text-xs text-[#4A4643]"><span>👩‍⚕️ ${nurseName}</span><span>${assignedBeds.length} 床</span></div>
                    <div class="flex flex-wrap gap-1">${assignedBeds.map(b => `<span class="bg-[#F0EDE6] px-2 py-1 rounded text-[11px] font-bold">${b}</span>`).join('')}</div>
                `;
                container.appendChild(card);
            });
        }

        function loadNurseBedsToPCEditor() {
            const nurseName = document.getElementById('pc-nurse-select').value;
            const container = document.getElementById('pc-scheduling-checkboxes');
            container.innerHTML = '';
            const currentAssigned = nurseBedAssignments[nurseName] || [];
            Object.keys(patientsData).sort().forEach(bedKey => {
                const isChecked = currentAssigned.includes(bedKey);
                const label = document.createElement('label');
                label.className = "flex items-center space-x-2 text-xs font-medium cursor-pointer text-[#5C554E]";
                label.innerHTML = `<input type="checkbox" value="${bedKey}" ${isChecked ? 'checked' : ''} class="w-4 h-4 accent-[#8C7A6B] rounded pc-bed-chk-item"><span>${bedKey} (${patientsData[bedKey].name || ''})</span>`;
                container.appendChild(label);
            });
        }

        function saveNurseAssignmentsFromPC() {
            const nurseName = document.getElementById('pc-nurse-select').value;
            const checkedBoxes = document.querySelectorAll('.pc-bed-chk-item:checked');
            let newBeds = [];
            checkedBoxes.forEach(chk => newBeds.push(chk.value));
            nurseBedAssignments[nurseName] = newBeds;

            localStorage.setItem(STORAGE_KEY_SCHEDULE, JSON.stringify(nurseBedAssignments));
            loadDataFromStorage();
            alert(`已成功更新【${nurseName}】排班，資料已寫入！`);
        }

        function renderVitalsTable() {
            const tbody = document.getElementById('pc-vitals-table-body');
            tbody.innerHTML = '';
            Object.keys(patientsData).sort().forEach(bedKey => {
                const p = patientsData[bedKey];
                if (!p || p.isEmpty) return;
                const latest = (p.vitals && p.vitals[0]) ? p.vitals[0] : { time: '--', t: '--', p: '--', bp: '--/--', spo2: '--' };
                const tr = document.createElement('tr');
                tr.innerHTML = `<td class="p-3 font-bold">${p.name || ''}</td><td class="p-3">${p.assignedNurse || '未指派'}</td><td class="p-3">${latest.time}</td><td class="p-3">${latest.t}℃</td><td class="p-3">${latest.p}次</td><td class="p-3">${latest.bp}</td><td class="p-3">${latest.spo2}%</td>`;
                tbody.appendChild(tr);
            });
        }

        function toggleMobileSimulator() {
            document.getElementById('pc-mobile-simulator-drawer').classList.toggle('hidden');
        }

        loadDataFromStorage();
    </script>
</body>
</html>
