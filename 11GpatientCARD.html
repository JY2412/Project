const $=id=>document.getElementById(id);let patients={},assignments={},lastPayload=null,busy=false,selectedBed='',loggedIn=false;
const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const text=v=>(v===null||v===undefined||String(v).trim()==='')?'未提供':String(v);
const pick=(p,keys)=>{for(const k of keys){if(p[k]!==undefined&&p[k]!==null&&String(p[k]).trim()!=='')return p[k]}return null};
const field=(label,value)=>`<div class="field"><div class="label">${safe(label)}</div><div class="value">${safe(text(value))}</div></div>`;
function getInfo(p){const info=String(p.info||'');const mrn=pick(p,['medicalRecordNo','medicalRecordNumber','medicalRecord','mrn','chartNo','patientId'])||info.match(/(?:病例號|病歷號)[:：]\s*([\w-]+)/)?.[1];const dob=pick(p,['birthDate','birthday','dob','dateOfBirth'])||pick(p.editInfo||{},['dob','birthday','birthDate'])||info.match(/\b\d{4}[/-]\d{1,2}[/-]\d{1,2}\b/)?.[0];const age=pick(p,['age','patientAge'])||info.match(/\((\d+\s*[Yy歲])\)/)?.[1];return {mrn,dob,age};}

// Mobile patient records store these values in editInfo and in the extra summary.
function summaryValue(p,kind){
 const s=String(p.extra||'');
 const re=kind==='blood'?/血型\s*[:：]\s*([^|｜,，;；\n]+)/:/過敏(?:史|記錄)?\s*[:：]\s*([^|｜;；\n]+)/;
 return s.match(re)?.[1]?.trim()||null;
}
function patientBlood(p){return pick(p,['blood','bloodType','blood_type','bloodGroup','aboBloodType'])||pick(p.editInfo||{},['blood','bloodType'])||summaryValue(p,'blood');}
function patientDiagnosis(p){
 const direct=pick(p,['diag','diagnosis']);
 const summary=String(p.extra||'').match(/(?:疾病)?診斷\s*[:：]\s*([^|｜\n]+)/)?.[1]?.trim();
 return (!direct||String(direct).trim()==='Stroke')?(summary||direct):direct;
}
function patientDoctor(p){return pick(p,['doctor','attendingDoctor','attendingPhysician'])||pick(p.editInfo||{},['doctor','attendingDoctor']);}
function patientAllergy(p){return pick(p.editInfo||{},['allergy','allergies'])||pick(p,['allergy','allergies','allergyHistory'])||summaryValue(p,'allergy');}
function parseBirth(value){
 if(!value)return null;
 const s=String(value).trim();const m=s.match(/^(\d{2,4})[\/.-](\d{1,2})[\/.-](\d{1,2})/);
 if(!m)return null;
 let y=Number(m[1]);if(y<1911)y+=1911;
 const mo=Number(m[2]),d=Number(m[3]);const dt=new Date(y,mo-1,d);
 return dt.getFullYear()===y&&dt.getMonth()===mo-1&&dt.getDate()===d?dt:null;
}
function ageInYearsMonths(birth){
 const dt=parseBirth(birth);if(!dt)return null;
 const now=new Date();if(dt>now)return null;
 let months=(now.getFullYear()-dt.getFullYear())*12+now.getMonth()-dt.getMonth();
 if(now.getDate()<dt.getDate())months--;
 return Math.floor(months/12)+'歲'+months%12+'個月';
}
function ageFromText(raw){
 if(raw==null||String(raw).trim()==='')return null;
 const s=String(raw).trim();const match=s.match(/^(\d+)\s*(?:Y|歲)(?:\s*(\d+)\s*(?:M|個月))?$/i);
 return match?match[1]+'歲'+(match[2]||'0')+'個月':/^\d+$/.test(s)?s+'歲（月份未提供）':s;
}

function render(){
 const bed=selectedBed,p=patients[bed];
 if(!p||p.isEmpty){$('name').textContent=bed+'　空床';$('mrn').textContent='未提供';$('demographics').innerHTML='';$('alerts').innerHTML='<span class="text-[#8c827a]">無病人資料</span>';$('team').innerHTML='';return}
 const info=getInfo(p);$('name').textContent=bed+'　'+displayPatientName(p);$('mrn').textContent=text(info.mrn);
 const age=ageInYearsMonths(info.dob) || ageFromText(info.age);
 const blood=patientBlood(p), allergy=patientAllergy(p);
 $('demographics').innerHTML=[['性別',pick(p,['gender','sex'])],['生日',info.dob],['年齡',age],['血型',blood],['過敏史',allergy],['疾病診斷',patientDiagnosis(p)]].map(([a,b])=>field(a,b)).join('');
  // 與護理站電子白板相同的單床標籤判斷及配色；僅讀取資料。
  const alerts=[];
  const badge=(label,classes)=>alerts.push(`<span class="inline-flex items-center px-3 py-1.5 text-sm rounded-lg font-bold ${classes}">${safe(label)}</span>`);
  const location=String(p.location||'').trim();
  const tagStyles={
   'ICU':'bg-orange-200 text-orange-900 border border-orange-300',
   '急診':'bg-red-700 text-white',
   '其他單位(轉床)':'bg-slate-200 text-slate-700 border border-slate-300',
   '其他單位':'bg-slate-200 text-slate-700 border border-slate-300',
   '門診':'bg-lime-700 text-white',
   '請假':'bg-slate-700 text-white',
   '檢查中':'bg-[#CCFBF1] text-[#115E59] border border-[#99F6E4]',
   '手術中':'bg-fuchsia-700 text-white',
   '傳送中':'bg-green-700 text-white'
  };
  const sourceBadge={'ICU':'I入','急診':'急','門診':'門','其他單位(轉床)':'轉','其他單位':'轉'};
  if(tagStyles[location])badge(sourceBadge[location]||location,tagStyles[location]);
  const iso=Array.isArray(p.isolation)?p.isolation:p.isolation?[p.isolation]:[];
  const used=new Set();
  for(const item of iso){const value=String(item);for(const code of ['接','疥','氣']){
   if((value.includes(code)||(code==='接'&&/contact/i.test(value))||(code==='疥'&&/scabies/i.test(value))||(code==='氣'&&/airborne/i.test(value)))&&!used.has(code)){
    used.add(code);
    const name={'接':'接觸隔離','疥':'疥瘡隔離','氣':'空氣隔離'}[code];
    alerts.push(`<img src="${HEAD_ISOLATION_ICONS[code]}" alt="${name}" title="${name}" class="w-12 h-12 object-contain shrink-0" />`);
   }
  }}
  const bloodStatus=String(p.bloodStatus||'').trim();
  const bloodRecordActive=!!p.bloodRecord && p.bloodRecord.status!=='已完成' && p.bloodRecord.status!=='結案';
  const paused=bloodRecordActive&&(bloodStatus==='輸血暫停'||p.bloodRecord.status==='輸血暫停');
  const transfusing=!paused&&bloodRecordActive&&(bloodStatus==='輸血中'||p.bloodRecord.status==='輸血中');
  const pending=!paused&&!transfusing&&!bloodRecordActive&&(bloodStatus==='待輸血'||(!!p.hasBlood&&!['已完成','結案','已取消','輸血暫停'].includes(bloodStatus)));
  if(pending)badge('待輸血','bg-amber-200 text-amber-950 border border-amber-400');
  if(transfusing)badge('輸血中','bg-rose-600 text-white border border-rose-700');
  if(paused)badge('輸血暫停中','bg-amber-100 text-amber-900 border border-amber-400');
  const activeEws=p.ewsItems&&typeof p.ewsItems==='object'?Object.values(p.ewsItems).filter(Boolean):[];
  if(activeEws.length>0||(p.ewsItems==null&&p.ewsAlert===true))badge('EWS警示','bg-purple-100 text-purple-800 border border-purple-300');
  if(p.isDischarging===true||p.isDischarging==='true')badge('今辦明出','bg-sky-700 text-white');
  if(p.dnr===true||p.dnr==='true')badge('DNR','bg-yellow-200 text-yellow-900 border border-yellow-300');
  // 保留床頭卡先前支援的其他特殊照護提示。
  for(const [key,label,classes] of [
   ['difficultIntubation','困難插管','bg-rose-100 text-rose-800 border border-rose-300'],
   ['fallRisk','跌倒高風險','bg-amber-100 text-amber-900 border border-amber-300'],
   ['bleedingRisk','出血風險','bg-rose-100 text-rose-800 border border-rose-300'],
   ['restraint','保護措施','bg-amber-100 text-amber-900 border border-amber-300'],
   ['npo','禁食','bg-amber-100 text-amber-900 border border-amber-300']
  ])if(p[key]===true)badge(label,classes);
 $('alerts').innerHTML=alerts.join('')||'<span class="text-[#8c827a]">目前沒有已登錄的照護警示</span>';
 $('team').innerHTML=[['主治醫師',patientDoctor(p)],['住院醫師',pick(p,['residentDoctor'])],['護理師',findNurse(bed,p)]].map(([a,b])=>field(a,b)).join('');
}
function displayPatientName(p){
 const gender=String(p.gender||p.sex||'').trim();
 if(p.isPublicName===false || p.isPublicName==='false') return `ＯＯＯ${gender?'（'+gender+'）':''}`;
 const name=String(p.realName||p.name||p.patientName||'').trim();
 if(!name)return '未提供';
 // 姓名只遮蔽中間一字，單字姓名則直接遮蔽。
 const chars=Array.from(name);
 if(chars.length===1)return 'Ｏ';
 if(chars.length===2)return chars[0]+'Ｏ';
 return chars[0]+'Ｏ'+chars.slice(2).join('');
}
function findNurse(bed,p){
 const names=Object.entries(assignments).filter(([name,beds])=>Array.isArray(beds)&&beds.includes(bed)).map(([name])=>name);
 return names.length?names.join('、'):pick(p,['assignedNurse','nurse']);
}
function updateBedOptions(){
 const keys=Object.keys(patients).sort((a,b)=>a.localeCompare(b,'zh-TW',{numeric:true}));
 const el=$('initial-bed'),old=el.value;
 el.innerHTML='<option value="">請選擇床號</option>'+keys.map(k=>`<option value="${safe(k)}">${safe(k)}</option>`).join('');
 if(keys.includes(old))el.value=old;
 else if(keys.includes(selectedBed))el.value=selectedBed;
}
function showScreen(id){for(const el of ['login-screen','select-screen','card-screen'])$(el).classList.toggle('hidden',el!==id)}
function openSelectedBed(){const bed=$('initial-bed').value;if(!bed||!Object.prototype.hasOwnProperty.call(patients,bed)){$('select-error').classList.remove('hidden');return}selectedBed=bed;$('select-error').classList.add('hidden');showScreen('card-screen');render()}
function verifyLogin(){const valid=$('login-user').value==='pa'&&$('login-pass').value==='pa';$('login-error').classList.toggle('hidden',valid);if(!valid)return;loggedIn=true;$('login-pass').value='';showScreen('select-screen');updateBedOptions()}
$('login-button').addEventListener('click',verifyLogin);
for(const id of ['login-user','login-pass'])$(id).addEventListener('keydown',e=>{if(e.key==='Enter')verifyLogin()});
$('enter-bed').addEventListener('click',openSelectedBed);
$('change-bed').addEventListener('click',()=>{$('change-pass').value='';$('change-error').classList.add('hidden');$('change-screen').classList.remove('hidden');$('change-pass').focus()});
$('cancel-change').addEventListener('click',()=>{$('change-screen').classList.add('hidden');$('change-pass').value='' });
function confirmChange(){if($('change-pass').value!=='pa'){$('change-error').classList.remove('hidden');return}$('change-screen').classList.add('hidden');$('change-pass').value='';$('initial-bed').value=selectedBed;showScreen('select-screen')}
$('confirm-change').addEventListener('click',confirmChange);
$('change-pass').addEventListener('keydown',e=>{if(e.key==='Enter')confirmChange()});
async function poll(){if(busy)return;busy=true;try{const res=await fetch(DB,{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);const data=await res.json();if(!data||typeof data!=='object')throw new Error('雲端尚無資料');const serial=JSON.stringify(data);if(serial!==lastPayload){lastPayload=serial;patients=data.patientsData||{};assignments=data.nurseBedAssignments||{};updateBedOptions();if(loggedIn&&selectedBed)render()}$('sync-text').textContent='雲端已連線 · 唯讀';$('updated').textContent=new Date().toLocaleString('zh-TW')}catch(err){$('sync-text').textContent='無法取得雲端資料';$('updated').textContent='讀取失敗：'+err.message}finally{busy=false}}
showScreen('login-screen');poll();setInterval(poll,5000);
</script></body></html>
